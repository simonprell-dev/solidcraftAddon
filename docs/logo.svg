<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>3D-Kurs für SolidCraft</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59A4A"/>
      <stop offset="1" stop-color="#D9621C"/>
    </linearGradient>
  </defs>
  <!-- Hintergrund: abgerundetes Quadrat -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Isometrischer Würfel -->
  <polygon points="64,26 99,46 64,66 29,46" fill="#FFFFFF"/>
  <polygon points="29,46 64,66 64,106 29,86" fill="#FFE2C7"/>
  <polygon points="64,66 99,46 99,86 64,106" fill="#FFC08C"/>
  <!-- Skizzen-Linie auf der Oberseite: aus einer Skizze wird ein Körper -->
  <polygon points="64,36 82,46 64,56 46,46" fill="none" stroke="#E8762C" stroke-width="4" stroke-linejoin="round" stroke-dasharray="7 5"/>
  <!-- Funkeln -->
  <path d="M104 14 L107.5 22.5 L116 26 L107.5 29.5 L104 38 L100.5 29.5 L92 26 L100.5 22.5 Z" fill="#FFE066"/>
</svg>
