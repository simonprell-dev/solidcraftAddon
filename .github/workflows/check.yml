name: Prüfen

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript-Syntax prüfen
        run: for f in background.js reset-pending.js lib/*.js course/*.js i18n/*.js; do node --check "$f"; done
      - name: Unit-Tests
        run: npm test
      - name: Kurs, Sprachen und Store-Grenzen prüfen
        run: npm run check
      - name: SEO der GitHub-Seite prüfen
        run: npm run check:seo
      - name: Manifest und _locales sind gültiges JSON
        run: node -e "for (const f of ['manifest.json','_locales/de/messages.json','_locales/en/messages.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Pakete bauen
        run: npm run pack
